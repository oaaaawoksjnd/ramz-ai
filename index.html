<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>RAMZ AI</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111a2b;--line:#26334a;--text:#eef3ff;--muted:#9ba9c2;--accent:#7c9cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{height:62px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#0c1322}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#6e8cff,#9d68e8);display:grid;place-items:center;font-weight:900;color:white}
.brand{font-weight:800;letter-spacing:.4px}.sub{font-size:11px;color:var(--muted)}
main{width:min(850px,100%);margin:auto;flex:1;overflow:auto;padding:22px 16px 14px}
.welcome{text-align:center;margin:12vh auto 28px;max-width:520px}.welcome h1{font-size:30px;margin:0 0 8px}.welcome p{color:var(--muted);line-height:1.6}
#chat{display:flex;flex-direction:column;gap:16px;padding-bottom:18px}
.msg{display:flex;gap:10px;align-items:flex-start}.avatar{flex:0 0 30px;height:30px;border-radius:10px;background:#202d46;display:grid;place-items:center;font-size:12px;font-weight:800}.msg.user .avatar{background:#354b80}
.bubble{max-width:calc(100% - 42px);line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;padding:11px 14px;border:1px solid var(--line);border-radius:4px 15px 15px 15px;background:var(--panel)}
.msg.user{flex-direction:row-reverse}.msg.user .bubble{background:#1b2942;border-radius:15px 4px 15px 15px}
footer{padding:12px 14px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0c1322}
form{width:min(850px,100%);margin:auto;display:flex;gap:9px;background:#131e31;border:1px solid #34425e;border-radius:17px;padding:8px}
textarea{flex:1;resize:none;max-height:140px;min-height:42px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:10px 6px}
button{border:0;border-radius:12px;background:var(--accent);color:#071020;font-weight:800;padding:0 17px;min-width:54px}
button:disabled{opacity:.5} .hint{text-align:center;color:var(--muted);font-size:11px;margin:8px 0 0}
.error{color:#ffb2b2}
</style>
</head>
<body>
<header><div class="logo">R</div><div><div class="brand">RAMZ AI</div><div class="sub">Asisten AI pribadi</div></div></header>
<main id="main">
  <section class="welcome" id="welcome"><h1>Ada yang bisa dibantu?</h1><p>Tanyakan apa saja. RAMZ AI siap membantu belajar, menulis, mencari ide, dan memahami kode.</p></section>
  <section id="chat" aria-live="polite"></section>
</main>
<footer>
  <form id="form"><textarea id="prompt" rows="1" maxlength="4000" placeholder="Tanyakan sesuatu kepada RAMZ AI..." required></textarea><button id="send" type="submit">➤</button></form>
  <div class="hint">Periksa kembali jawaban AI. Jangan masukkan kata sandi atau data pribadi.</div>
</footer>
<script>
const form=document.getElementById('form'), input=document.getElementById('prompt'), send=document.getElementById('send'), chat=document.getElementById('chat'), welcome=document.getElementById('welcome');
const history=[];
function addMessage(role,text){
  welcome.hidden=true;
  const row=document.createElement('div'); row.className='msg '+role;
  const avatar=document.createElement('div'); avatar.className='avatar'; avatar.textContent=role==='user'?'K':'R';
  const bubble=document.createElement('div'); bubble.className='bubble'; bubble.textContent=text;
  row.append(avatar,bubble); chat.append(row);
  document.getElementById('main').scrollTop=document.getElementById('main').scrollHeight;
  return bubble;
}
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});
form.addEventListener('submit',async e=>{
 e.preventDefault(); const text=input.value.trim(); if(!text||send.disabled)return;
 addMessage('user',text); history.push({role:'user',parts:[{text}]});
 input.value='';input.style.height='auto';send.disabled=true;send.textContent='…';
 const waiting=addMessage('assistant','RAMZ AI sedang berpikir...');
 try{
  const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:history.slice(-12)})});
  const data=await response.json();
  if(!response.ok) throw new Error(data.error||'Permintaan gagal. Coba lagi.');
  const answer=data.answer||'Maaf, belum ada jawaban.';
  waiting.textContent=answer; history.push({role:'model',parts:[{text:answer}]});
 }catch(err){waiting.textContent='Gagal: '+err.message;waiting.classList.add('error');history.pop();}
 finally{send.disabled=false;send.textContent='➤';input.focus();}
});
</script>
</body>
</html>
